<!DOCTYPE html>
<html>
<head>
    <title>LPU Campus Courier System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f6;
            margin: 0;
            padding: 0;
            color: #333333;
        }
        .header {
            background-color: #e65100;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .header h2 {
            margin: 0;
            font-size: 24px;
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: #ffe0b2;
        }
        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px;
        }
        .box {
            background-color: white;
            padding: 20px 25px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-top: 4px solid #e65100;
        }
        .box h3 {
            margin-top: 0;
            color: #e65100;
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 10px;
        }
        label {
            font-weight: bold;
            font-size: 13px;
            color: #555555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus {
            border-color: #e65100;
            outline: none;
        }
        .main-btn {
            background-color: #e65100;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
        }
        .main-btn:hover {
            background-color: #bf360c;
        }
        .verify-btn {
            background-color: #1976d2;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .verify-btn:hover {
            background-color: #0d47a1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border-bottom: 1px solid #dddddd;
            padding: 12px 10px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f8f9fa;
            color: #444444;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .badge-pending {
            background-color: #fff3cd;
            color: #856404;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-delivered {
            background-color: #d4edda;
            color: #155724;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .token-msg {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            border: 1px solid #a5d6a7;
            text-align: center;
            font-size: 16px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>LPU Campus Courier & Hostel Delivery System</h2>
        <p>Security Guard & Student Package Collection Portal</p>
    </div>

    <div class="container">
        <!-- Box 1: Guard Form -->
        <div class="box">
            <h3>1. Guard Package Logging Form</h3>
            
            <label>Student Name:</label>
            <input type="text" id="sname" placeholder="e.g. Aarav Sharma">

            <label>Registration / Roll Number:</label>
            <input type="text" id="sroll" placeholder="e.g. 12204567">

            <label>Hostel Block:</label>
            <select id="shostel">
                <option value="BH-1">BH-1</option>
                <option value="BH-2">BH-2</option>
                <option value="BH-3">BH-3</option>
                <option value="BH-4">BH-4</option>
                <option value="GH-1">GH-1</option>
                <option value="GH-2">GH-2</option>
            </select>

            <label>Courier Company:</label>
            <select id="scourier">
                <option value="Amazon">Amazon</option>
                <option value="Flipkart">Flipkart</option>
                <option value="Myntra">Myntra</option>
                <option value="Delhivery">Delhivery</option>
                <option value="BlueDart">BlueDart</option>
            </select>

            <label>Tracking Last 4 Digits:</label>
            <input type="text" id="strack" maxlength="4" placeholder="e.g. 4521">

            <button class="main-btn" onclick="addPackage()">+ Log Package & Generate Token</button>

            <div id="tokenBox" class="token-msg">
                Package Logged Successfully! Student Pickup Token: <b id="showPin" style="font-size: 22px;"></b>
            </div>
        </div>

        <!-- Box 2: Search and Table -->
        <div class="box">
            <h3>2. Package Collection Board</h3>
            
            <label>Search Student Name or Roll Number:</label>
            <input type="text" id="searchBox" onkeyup="showTable()" placeholder="Type student name or roll number to search...">

            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Roll No</th>
                        <th>Hostel</th>
                        <th>Courier</th>
                        <th>Tracking</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableData">
                    <!-- Rows will come here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Sample data array
        var packages = [
            { name: "Rohan Verma", roll: "12201452", hostel: "BH-1", courier: "Amazon", track: "1234", pin: "4567", status: "Pending" },
            { name: "Priya Sharma", roll: "12208931", hostel: "GH-2", courier: "Myntra", track: "5678", pin: "8910", status: "Delivered" }
        ];

        // Function to add new package
        function addPackage() {
            var name = document.getElementById("sname").value;
            var roll = document.getElementById("sroll").value;
            var hostel = document.getElementById("shostel").value;
            var courier = document.getElementById("scourier").value;
            var track = document.getElementById("strack").value;

            if (name == "" || roll == "" || track == "") {
                alert("Please fill all details!");
                return;
            }

            // Generate 4 digit random pin
            var randomPin = Math.floor(1000 + Math.random() * 9000);

            var newObj = {
                name: name,
                roll: roll,
                hostel: hostel,
                courier: courier,
                track: track,
                pin: randomPin,
                status: "Pending"
            };

            packages.push(newObj);

            // Show pin on screen
            document.getElementById("showPin").innerHTML = randomPin;
            document.getElementById("tokenBox").style.display = "block";

            // Clear inputs
            document.getElementById("sname").value = "";
            document.getElementById("sroll").value = "";
            document.getElementById("strack").value = "";

            showTable();
        }

        // Function to display table and search
        function showTable() {
            var search = document.getElementById("searchBox").value.toLowerCase();
            var tbody = document.getElementById("tableData");
            tbody.innerHTML = "";

            for (var i = 0; i < packages.length; i++) {
                var p = packages[i];

                // Check search filter
                if (p.name.toLowerCase().indexOf(search) > -1 || p.roll.indexOf(search) > -1) {
                    var btn = "";
                    var statusBadge = "";

                    if (p.status == "Pending") {
                        statusBadge = "<span class='badge-pending'>Pending</span>";
                        btn = "<button class='verify-btn' onclick='verifyToken(" + i + ")'>Verify Token</button>";
                    } else {
                        statusBadge = "<span class='badge-delivered'>Delivered</span>";
                        btn = "<span style='color:gray;'>Completed</span>";
                    }

                    var row = "<tr>" +
                        "<td><b>" + p.name + "</b></td>" +
                        "<td>" + p.roll + "</td>" +
                        "<td>" + p.hostel + "</td>" +
                        "<td>" + p.courier + "</td>" +
                        "<td>#" + p.track + "</td>" +
                        "<td>" + statusBadge + "</td>" +
                        "<td>" + btn + "</td>" +
                        "</tr>";

                    tbody.innerHTML += row;
                }
            }
        }

        // Function to verify token
        function verifyToken(index) {
            var userPin = prompt("Enter 4-digit Pickup Token (Hint: " + packages[index].pin + "):");
            
            if (userPin == packages[index].pin) {
                packages[index].status = "Delivered";
                alert("Package Delivered Successfully!");
                showTable();
            } else {
                alert("Wrong Token! Cannot deliver package.");
            }
        }

        // Load initial data
        showTable();
    </script>

</body>
</html>
